services:
  bv_app:
    build: .
    ports:
      - "5001:5000"
    depends_on:
      - redis
    environment:
      - FLASK_ENV=production
      - REDIS_HOST=redis
    volumes:
      - ./uploads:/app/uploads
      - ./static/generated:/app/static/generated
      - ./logs:/app/logs

  redis:
    image: "redis:7-alpine"     
    restart: "always"           
    ports:
      - "6379:6379"           
    command: redis-server /usr/local/etc/redis/redis.conf  
    volumes:
      - ./redis-conf/redis.conf:/usr/local/etc/redis/redis.conf            
      - redis-data:/data           

  eviction_worker:
    build: .
    command: python -m streaming.eviction_worker
    restart: always
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    volumes:
      - ./streaming:/app/streaming

  anomaly_router:
    build: .
    command: python -m streaming.anomaly_router
    restart: always
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    volumes:
      - ./streaming:/app/streaming
      - ./logs:/app/logs

volumes:
  redis-data:
