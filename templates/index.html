<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>LogSec Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <h1 class="mb-3">Анализатор логов</h1>
  <p class="text-muted">Загрузите access-log (Nginx/Apache) и получите понятный отчет по подозрительной активности.</p>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert alert-warning">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  <div class="card p-4">
    <form action="/analyze" method="post" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">Файл лога (*.log или *.txt)</label>
        <input class="form-control" type="file" name="logfile" required>
        <div class="form-text text-muted">Максимальный размер файла — 15 MB.</div>
      </div>
      <button class="btn btn-primary">Запустить анализ</button>
    </form>
  </div>

</body>
</html>
