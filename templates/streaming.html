<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Streaming Monitor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
  <style>
    body { background: #0d1117; color: #c9d1d9; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
    .card-header { background: #21262d; border-bottom: 1px solid #30363d; font-weight: 600; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot-normal { background: #3fb950; }
    .dot-suspicious { background: #d29922; }
    .dot-warning { background: #db6d28; }
    .dot-attack { background: #f85149; }
    .stat-value { font-size: 2rem; font-weight: 700; }
    .stat-label { font-size: 0.85rem; color: #8b949e; }
    .log-line { font-family: monospace; font-size: 0.8rem; padding: 4px 8px; border-bottom: 1px solid #21262d; }
    .log-line:last-child { border-bottom: none; }
    .level-normal { border-left: 3px solid #3fb950; }
    .level-suspicious { border-left: 3px solid #d29922; }
    .level-warning { border-left: 3px solid #db6d28; }
    .level-attack { border-left: 3px solid #f85149; }
    .ip-badge { font-family: monospace; font-size: 0.85rem; }
    .navbar-custom { background: #161b22; border-bottom: 1px solid #30363d; }
    .plotly-graph { border-radius: 8px; overflow: hidden; }
    #connection-status { font-size: 0.8rem; }
    .table { color: #c9d1d9; }
    .table thead th { border-color: #30363d; color: #8b949e; font-size: 0.8rem; text-transform: uppercase; }
    .table td { border-color: #21262d; }
    .incident-card { font-size: 0.85rem; padding: 10px; margin-bottom: 6px; background: #1c1218; border: 1px solid #f8514930; border-radius: 8px; }
  </style>
</head>
<body>

<nav class="navbar navbar-custom px-4 py-2 mb-4">
  <div class="d-flex align-items-center gap-3">
    <a href="/" class="text-decoration-none text-light fw-bold">LogSec</a>
    <span class="text-muted">/</span>
    <span>Streaming Monitor</span>
  </div>
  <div class="d-flex align-items-center gap-3">
    <span id="connection-status" class="text-muted">Connecting...</span>
    <span id="last-update" class="text-muted" style="font-size:0.8rem;"></span>
  </div>
</nav>

<div class="container-fluid px-4">

  <!-- Stats Row -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card p-3 text-center">
        <div class="stat-value" id="stat-total-ips">-</div>
        <div class="stat-label">Active IPs</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3 text-center">
        <div class="stat-value" id="stat-queue-size">-</div>
        <div class="stat-label">Queue Size</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3 text-center">
        <div class="stat-value text-warning" id="stat-suspicious">-</div>
        <div class="stat-label">Suspicious IPs</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3 text-center">
        <div class="stat-value text-danger" id="stat-attacks">-</div>
        <div class="stat-label">Attack IPs</div>
      </div>
    </div>
  </div>

  <!-- Charts Row -->
  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header px-3 py-2">Threat Levels</div>
        <div class="card-body p-2">
          <div id="chart-levels" class="plotly-graph" style="height:300px;"></div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-header px-3 py-2">Top IPs by Request Count</div>
        <div class="card-body p-2">
          <div id="chart-top-ips" class="plotly-graph" style="height:300px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Timeline + Logs Row -->
  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header px-3 py-2">Request Timeline</div>
        <div class="card-body p-2">
          <div id="chart-timeline" class="plotly-graph" style="height:280px;"></div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-header px-3 py-2">ML Incidents</div>
        <div class="card-body p-2" id="ml-incidents" style="height:280px; overflow-y:auto;">
          <p class="text-muted small text-center mt-5">No incidents detected</p>
        </div>
      </div>
    </div>
  </div>

  <!-- IP Table + Live Logs -->
  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header px-3 py-2">Active IPs</div>
        <div class="card-body p-0" style="max-height:400px; overflow-y:auto;">
          <table class="table table-sm mb-0">
            <thead><tr><th>IP</th><th>Requests</th><th>Level</th></tr></thead>
            <tbody id="ip-table-body">
              <tr><td colspan="3" class="text-center text-muted py-3">Waiting for data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-header px-3 py-2">Live Log Feed</div>
        <div class="card-body p-0" id="log-feed" style="max-height:400px; overflow-y:auto;">
          <p class="text-muted small text-center py-3">Waiting for data...</p>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const COLORS = {
  normal: '#3fb950',
  suspicious: '#d29922',
  warning: '#db6d28',
  attack: '#f85149'
};

const PLOTLY_LAYOUT = {
  paper_bgcolor: 'rgba(0,0,0,0)',
  plot_bgcolor: 'rgba(0,0,0,0)',
  font: { color: '#8b949e', size: 11 },
  margin: { t: 10, b: 40, l: 50, r: 20 },
  xaxis: { gridcolor: '#21262d' },
  yaxis: { gridcolor: '#21262d' }
};

let timelineData = [];
const MAX_TIMELINE_POINTS = 60;

function updateStats(data) {
  document.getElementById('stat-total-ips').textContent = data.total_ips;
  document.getElementById('stat-queue-size').textContent = data.queue_size;
  document.getElementById('stat-suspicious').textContent =
    (data.level_counts.suspicious || 0) + (data.level_counts.warning || 0);
  document.getElementById('stat-attacks').textContent = data.level_counts.attack || 0;
}

function updateLevelChart(data) {
  const levels = ['normal', 'suspicious', 'warning', 'attack'];
  const values = levels.map(l => data.level_counts[l] || 0);
  const colors = levels.map(l => COLORS[l]);

  Plotly.react('chart-levels', [{
    values: values,
    labels: ['Normal', 'Suspicious', 'Warning', 'Attack'],
    type: 'pie',
    hole: 0.5,
    marker: { colors: colors },
    textinfo: 'value+label',
    textfont: { size: 12, color: '#c9d1d9' }
  }], {
    ...PLOTLY_LAYOUT,
    showlegend: false,
    margin: { t: 10, b: 10, l: 10, r: 10 }
  }, { responsive: true, displayModeBar: false });
}

function updateTopIpsChart(data) {
  const ips = data.ips.slice(0, 15);
  if (ips.length === 0) return;

  const sorted = [...ips].reverse();
  Plotly.react('chart-top-ips', [{
    y: sorted.map(ip => ip.ip),
    x: sorted.map(ip => ip.count),
    type: 'bar',
    orientation: 'h',
    marker: {
      color: sorted.map(ip => COLORS[ip.level])
    }
  }], {
    ...PLOTLY_LAYOUT,
    yaxis: { ...PLOTLY_LAYOUT.yaxis, tickfont: { family: 'monospace', size: 11 } },
    margin: { t: 10, b: 40, l: 120, r: 20 }
  }, { responsive: true, displayModeBar: false });
}

function updateTimeline(data) {
  const now = new Date();
  timelineData.push({
    time: now,
    normal: data.level_counts.normal || 0,
    suspicious: data.level_counts.suspicious || 0,
    warning: data.level_counts.warning || 0,
    attack: data.level_counts.attack || 0,
    total: data.total_ips
  });

  if (timelineData.length > MAX_TIMELINE_POINTS) {
    timelineData = timelineData.slice(-MAX_TIMELINE_POINTS);
  }

  const times = timelineData.map(d => d.time);

  Plotly.react('chart-timeline', [
    {
      x: times, y: timelineData.map(d => d.normal),
      name: 'Normal', type: 'scatter', mode: 'lines',
      line: { color: COLORS.normal, width: 2 }, fill: 'tozeroy',
      fillcolor: COLORS.normal + '15'
    },
    {
      x: times, y: timelineData.map(d => d.suspicious),
      name: 'Suspicious', type: 'scatter', mode: 'lines',
      line: { color: COLORS.suspicious, width: 2 }
    },
    {
      x: times, y: timelineData.map(d => d.attack),
      name: 'Attack', type: 'scatter', mode: 'lines',
      line: { color: COLORS.attack, width: 2 }
    }
  ], {
    ...PLOTLY_LAYOUT,
    showlegend: true,
    legend: { x: 0, y: 1.15, orientation: 'h', font: { size: 10 } }
  }, { responsive: true, displayModeBar: false });
}

function updateIpTable(data) {
  const tbody = document.getElementById('ip-table-body');
  if (data.ips.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-3">No active IPs</td></tr>';
    return;
  }

  tbody.innerHTML = data.ips.map(ip => `
    <tr>
      <td class="ip-badge">${ip.ip}</td>
      <td>${ip.count}</td>
      <td><span class="status-dot dot-${ip.level}"></span>${ip.level}</td>
    </tr>
  `).join('');
}

function updateLogFeed(data) {
  const feed = document.getElementById('log-feed');
  if (data.recent_logs.length === 0) {
    feed.innerHTML = '<p class="text-muted small text-center py-3">No logs yet</p>';
    return;
  }

  feed.innerHTML = data.recent_logs.map(log =>
    `<div class="log-line level-${log.level}">${escapeHtml(log.raw)}</div>`
  ).join('');
}

function updateMlIncidents(data) {
  const container = document.getElementById('ml-incidents');
  if (!data.ml_incidents || data.ml_incidents.length === 0) {
    container.innerHTML = '<p class="text-muted small text-center mt-5">No incidents detected</p>';
    return;
  }

  container.innerHTML = data.ml_incidents.map(inc => `
    <div class="incident-card">
      <strong class="text-danger">${escapeHtml(inc.type || 'UNKNOWN')}</strong>
      <span class="text-muted ms-2">${escapeHtml(inc.ip || '')}</span>
      <div class="text-muted mt-1">${escapeHtml(inc.detail || '')}</div>
    </div>
  `).join('');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

async function fetchAndUpdate() {
  try {
    const resp = await fetch('/api/streaming/status');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const data = await resp.json();

    updateStats(data);
    updateLevelChart(data);
    updateTopIpsChart(data);
    updateTimeline(data);
    updateIpTable(data);
    updateLogFeed(data);
    updateMlIncidents(data);

    document.getElementById('connection-status').innerHTML =
      '<span class="text-success">Connected</span>';
    document.getElementById('last-update').textContent =
      'Updated: ' + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById('connection-status').innerHTML =
      '<span class="text-danger">Disconnected</span>';
    console.error('Fetch error:', err);
  }
}

// Initial fetch + interval
fetchAndUpdate();
setInterval(fetchAndUpdate, 3000);
</script>

</body>
</html>
