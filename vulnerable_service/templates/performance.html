{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>Feed Recommendations API</h1>
  <p class="subtitle">Run recommendation generation and inspect API latency.</p>

  <div class="controls" data-feed-controls>
    <label>
      Work Units
      <input type="number" min="5000" max="350000" value="120000" data-feed-units>
    </label>
    <button class="btn" data-feed-run>Run API Request</button>
  </div>

  <pre class="output-box" data-feed-output>Ready.</pre>
</section>
{% endblock %}
